<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- KLSentral Bites app icon: bold B + orange dot (brand accent from wordmark) -->
  <rect width="512" height="512" fill="#000000"/>
  <!-- Accent: orange dot (positioned like a mark above the bowl of B) -->
  <circle cx="332" cy="128" r="26" fill="#FF7A00"/>
  <!-- Primary: large extrabold B, centered with safe margin -->
  <text
    x="256"
    y="256"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-size="300"
    font-weight="800"
    fill="#FFFFFF"
    letter-spacing="-0.06em"
  >B</text>
</svg>
